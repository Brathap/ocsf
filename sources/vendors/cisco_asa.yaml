# Cisco ASA 5500 Series Firewall Pack
metadata:
  vendor: "Cisco"
  product: "ASA"
  version: "9.16"
  priority: 150
  description: "Standard Cisco Adaptive Security Appliance traffic flow and teardown logs."

detection:
  match_regex:
    - "%ASA-[0-9]-[0-9]+:"
    - "%ASA-6-302013:"
    - "%ASA-6-302014:"
    - "%ASA-4-106023:"

parser:
  type: "regex"
  pattern: "%ASA-(?P<severity_num>[0-9])-(?P<message_id>[0-9]+):\\s+(?P<action>\\w+)\\s+(?:\\w+\\s+)?(?P<protocol>\\w+)\\s+connection\\s+\\d+\\s+for\\s+\\w+:(?P<src_ip>[0-9.]+)/(?P<src_port>\\d+)(?:\\s+\\(\\S+\\))?\\s+to\\s+\\w+:(?P<dst_ip>[0-9.]+)/(?P<dst_port>\\d+)"

ocsf:
  class_uid: 4001
  category_name: "Network Activity"
  activity_name: "Traffic Flow"

mappings:
  "src_endpoint.ip": "src_ip"
  "src_endpoint.port": "src_port"
  "dst_endpoint.ip": "dst_ip"
  "dst_endpoint.port": "dst_port"
  "connection_info.protocol_name": "protocol"
  "activity_name": "action"

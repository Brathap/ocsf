# Check Point Log Exporter Syslog Pack
metadata:
  vendor: "Check Point"
  product: "Log Exporter"
  version: "R80.x"
  priority: 135
  description: "Check Point Log Exporter key-value security logs."

detection:
  match_regex:
    - "cp_severity="
    - "product=\"?VPN-1 & FireWall-1\"?"
    - "product=\"?SmartDefense\"?"
    - "CheckPoint"

parser:
  type: "kv"

ocsf:
  class_uid: 4001
  category_name: "Network Activity"
  activity_name: "Security Event"

mappings:
  "src_endpoint.ip": "src"
  "src_endpoint.port": "spt"
  "dst_endpoint.ip": "dst"
  "dst_endpoint.port": "dpt"
  "connection_info.protocol_name": "proto"
  "activity_name": "action"
  "device.name": "originsicname"
